name: Engineering correctness
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  correctness:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: fixture-only
          POSTGRES_DB: taskgenie_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d taskgenie_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      BOOKING_TEST_DATABASE_URL: postgresql://postgres:fixture-only@127.0.0.1:5432/taskgenie_test
      CHAT_TEST_DATABASE_URL: postgresql://postgres:fixture-only@127.0.0.1:5432/taskgenie_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --prefix server
      - run: npm ci --prefix client
      - run: node client/node_modules/playwright/cli.js install --with-deps chromium
      - run: npm run verify:engineering -- --browser
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: engineering-evidence
          path: work/engineering-evidence/
