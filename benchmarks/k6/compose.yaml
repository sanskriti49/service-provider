services:
  postgres:
    image: postgis/postgis:15-3.4-alpine
    container_name: taskgenie-k6-postgres
    environment:
      POSTGRES_USER: taskgenie_bench
      POSTGRES_PASSWORD: local_bench_only
      POSTGRES_DB: taskgenie_bench
    ports: ["127.0.0.1:5544:5432"]
    cpus: 2
    mem_limit: 2g
    command: ["postgres", "-c", "shared_preload_libraries=pg_stat_statements", "-c", "pg_stat_statements.track=all"]
  redis:
    image: redis:7-alpine
    container_name: taskgenie-k6-redis
    ports: ["127.0.0.1:6384:6379"]
    cpus: 1
    mem_limit: 256m
