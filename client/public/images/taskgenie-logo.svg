<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" fill="none">
  <defs>
    <!-- Rich Indigo to Royal Violet Lamp Body -->
    <linearGradient id="tg-body" x1="20%" y1="10%" x2="80%" y2="90%">
      <stop offset="0%" stop-color="#8B5CF6" />
      <stop offset="45%" stop-color="#6366F1" />
      <stop offset="100%" stop-color="#312E81" />
    </linearGradient>

    <!-- Warm Golden Flame / Magic Star Gradient -->
    <linearGradient id="tg-gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FEF3C7" />
      <stop offset="30%" stop-color="#FDE047" />
      <stop offset="70%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#D97706" />
    </linearGradient>

    <!-- Warm Ambient Light -->
    <radialGradient id="tg-glow" cx="68%" cy="28%" r="45%">
      <stop offset="0%" stop-color="#F59E0B" stop-opacity="0.35" />
      <stop offset="50%" stop-color="#8B5CF6" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#6366F1" stop-opacity="0" />
    </radialGradient>

    <!-- Subtle Lamp Surface Highlight -->
    <linearGradient id="tg-highlight" x1="30%" y1="20%" x2="70%" y2="80%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0" />
    </linearGradient>

    <!-- Soft Filter for Magical Warmth -->
    <filter id="tg-soft-glow" x="-25%" y="-25%" width="150%" height="150%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Ambient Glow Behind Star & Spout -->
  <circle cx="86" cy="30" r="26" fill="url(#tg-glow)" />

  <!-- The Artisanal Genie Lamp -->
  <g id="lamp">
    <!-- Pedestal Base -->
    <ellipse cx="56" cy="94" rx="18" ry="4" fill="url(#tg-gold)" />
    <path d="M 48 91 L 51 83 L 61 83 L 64 91 Z" fill="url(#tg-body)" />

    <!-- Lamp Body & Spout (Smooth Hand-Crafted Contour) -->
    <path d="M 44 65
             C 33 66, 28 73, 31 80
             C 34 85, 44 85, 56 84
             C 70 83, 82 76, 91 66
             C 95 61, 99 56, 103 50
             C 100 53, 94 57, 88 59
             C 78 63, 71 64, 65 65
             Z"
          fill="url(#tg-body)" />

    <!-- Inner Body Shading / Volume -->
    <path d="M 36 76 C 34 71, 41 67, 51 66 C 60 65, 68 67, 72 70 C 64 74, 52 77, 41 77 C 38 77, 37 76.5, 36 76 Z"
          fill="url(#tg-highlight)" />

    <!-- Ergonomic Loop Handle -->
    <path d="M 33 69
             C 19 65, 13 77, 16 85
             C 18 90, 24 90, 26 86
             C 19 82, 20 74, 30 73
             Z"
          fill="url(#tg-gold)" />

    <!-- Lamp Lid & Finial -->
    <ellipse cx="55" cy="65" rx="11" ry="3" fill="url(#tg-gold)" />
    <circle cx="55" cy="58" r="3.5" fill="url(#tg-gold)" />
    <circle cx="55" cy="57" r="1.2" fill="#FEF3C7" />
  </g>

  <!-- Luminous Rising Magic Spark / Star -->
  <g id="magic-spark" filter="url(#tg-soft-glow)">
    <!-- Main 4-Point Golden Star -->
    <path d="M 88 16
             Q 88 27 99 27
             Q 88 27 88 38
             Q 88 27 77 27
             Q 88 27 88 16 Z"
          fill="url(#tg-gold)" />

    <!-- Radiant White Star Core -->
    <circle cx="88" cy="27" r="2.5" fill="#FFFFFF" />

    <!-- Secondary Delicate Sparkle -->
    <path d="M 72 38
             Q 72 43 77 43
             Q 72 43 72 48
             Q 72 43 67 43
             Q 72 43 72 38 Z"
          fill="url(#tg-gold)" opacity="0.9" />

    <!-- Rising Golden Embers -->
    <circle cx="98" cy="42" r="1.6" fill="#FDE047" />
    <circle cx="82" cy="48" r="1.3" fill="#F59E0B" />
    <circle cx="92" cy="11" r="1.1" fill="#FEF3C7" />
  </g>
</svg>
