<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <!-- Background Squircle Gradient -->
    <linearGradient id="fav-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2e1065" />
      <stop offset="60%" stop-color="#1e1035" />
      <stop offset="100%" stop-color="#0f0728" />
    </linearGradient>

    <!-- Subtle Border Glow -->
    <linearGradient id="fav-border" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a855f7" />
      <stop offset="50%" stop-color="#ec4899" />
      <stop offset="100%" stop-color="#6366f1" />
    </linearGradient>

    <!-- Lamp Body Gradient -->
    <linearGradient id="fav-lamp" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#c084fc" />
      <stop offset="50%" stop-color="#8b5cf6" />
      <stop offset="100%" stop-color="#6366f1" />
    </linearGradient>

    <!-- Gold Spark Gradient -->
    <linearGradient id="fav-gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="50%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>

    <!-- Filter for subtle glow -->
    <filter id="fav-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.2" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Squircle App Badge -->
  <rect x="2" y="2" width="60" height="60" rx="15" fill="url(#fav-bg)" stroke="url(#fav-border)" stroke-width="1.5" />

  <!-- Magic Lamp Silhouette -->
  <!-- Lamp Base -->
  <ellipse cx="28" cy="51" rx="12" ry="3.5" fill="url(#fav-gold)" />
  <path d="M23 49 L25 45 L31 45 L33 49 Z" fill="url(#fav-lamp)" />

  <!-- Lamp Belly & Spout -->
  <path d="M15 41 C13 35 18 31 26 31 C35 31 42 35 47 36 C50 37 53 35 55 32 C56 31 57 32 56 34 C54 39 49 42 43 44 C34 46 19 46 15 41 Z"
        fill="url(#fav-lamp)" />

  <!-- Lamp Handle -->
  <path d="M16 33 C10 32 7 37 8 42 C9 45 11 46 14 44 C12 43 11 39 13 37 C14 35 15 34 17 34 Z"
        fill="url(#fav-gold)" />

  <!-- Lamp Lid -->
  <ellipse cx="26" cy="31" rx="6" ry="2" fill="url(#fav-gold)" />
  <circle cx="26" cy="28.5" r="1.8" fill="url(#fav-gold)" />

  <!-- Genie Magic Sparkle / Task Star -->
  <g transform="translate(45, 14)" filter="url(#fav-glow)">
    <path d="M7 0 C7 3.8 10.2 7 14 7 C10.2 7 7 10.2 7 14 C7 10.2 3.8 7 0 7 C3.8 7 7 3.8 7 0 Z"
          fill="url(#fav-gold)" />
    <path d="M7 2.5 C7 5 9 7 11.5 7 C9 7 7 9 7 11.5 C7 9 5 7 2.5 7 C5 7 7 5 7 2.5 Z"
          fill="#ffffff" />
  </g>

  <!-- Rising Magic Energy Sparkle Dots -->
  <circle cx="36" cy="22" r="1.2" fill="#38bdf8" />
  <circle cx="56" cy="28" r="1" fill="#ec4899" />
</svg>
