<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <!-- Background Canvas Gradient -->
    <linearGradient id="fav-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E1B4B" />
      <stop offset="60%" stop-color="#130F2E" />
      <stop offset="100%" stop-color="#090514" />
    </linearGradient>

    <!-- Refined Border Stroke -->
    <linearGradient id="fav-stroke" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8B5CF6" stop-opacity="0.8" />
      <stop offset="50%" stop-color="#6366F1" stop-opacity="0.5" />
      <stop offset="100%" stop-color="#F59E0B" stop-opacity="0.6" />
    </linearGradient>

    <!-- Warm Golden Flame & Lamp Gradient -->
    <linearGradient id="fav-gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FEF3C7" />
      <stop offset="40%" stop-color="#FDE047" />
      <stop offset="80%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#D97706" />
    </linearGradient>

    <!-- Royal Violet / Indigo Lamp Body -->
    <linearGradient id="fav-body" x1="20%" y1="10%" x2="80%" y2="90%">
      <stop offset="0%" stop-color="#A78BFA" />
      <stop offset="50%" stop-color="#7C3AED" />
      <stop offset="100%" stop-color="#4F46E5" />
    </linearGradient>

    <!-- Luminous Spark Glow -->
    <radialGradient id="fav-spark-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#F59E0B" stop-opacity="0.5" />
      <stop offset="100%" stop-color="#F59E0B" stop-opacity="0" />
    </radialGradient>
  </defs>

  <!-- Modern Rounded Squircle Badge -->
  <rect x="2" y="2" width="60" height="60" rx="14" fill="url(#fav-bg)" stroke="url(#fav-stroke)" stroke-width="1.5" />

  <!-- Ambient Glow Behind Spark -->
  <circle cx="45" cy="19" r="14" fill="url(#fav-spark-glow)" />

  <!-- Scaled, High-Contrast Lamp Silhouette -->
  <!-- Base Pedestal -->
  <ellipse cx="29" cy="50" rx="11" ry="2.8" fill="url(#fav-gold)" />
  <path d="M 24 48 L 26 43 L 32 43 L 34 48 Z" fill="url(#fav-body)" />

  <!-- Lamp Belly & Upward Sweeping Spout -->
  <path d="M 22 32
           C 15 33, 12 37, 14 41
           C 16 45, 23 45, 29 44
           C 37 43, 44 39, 49 33
           C 51 30, 54 27, 56 24
           C 54 26, 50 28, 47 29
           C 41 31, 37 32, 33 32
           Z"
        fill="url(#fav-body)" />

  <!-- Lamp Lid & Finial -->
  <ellipse cx="28" cy="32" rx="6.5" ry="1.8" fill="url(#fav-gold)" />
  <circle cx="28" cy="28.5" r="2" fill="url(#fav-gold)" />

  <!-- Ergonomic Loop Handle -->
  <path d="M 16 34
           C 8 32, 4 39, 6 44
           C 7 47, 11 47, 12 45
           C 8 43, 8 38, 14 37
           Z"
        fill="url(#fav-gold)" />

  <!-- Radiant Magic Sparkle Star -->
  <path d="M 46 11
           Q 46 19 54 19
           Q 46 19 46 27
           Q 46 19 38 19
           Q 46 19 46 11 Z"
        fill="url(#fav-gold)" />

  <circle cx="46" cy="19" r="1.5" fill="#FFFFFF" />

  <!-- Subtle Floating Magic Ember -->
  <circle cx="36" cy="23" r="1" fill="#FEF3C7" opacity="0.9" />
</svg>
